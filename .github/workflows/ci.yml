name: CI

on:
  push:
    branches: [ main, master, dev-integration ]
  pull_request:
    branches: [ main, master, dev-integration ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run black (check)
        run: black --check --line-length 100 oneplanet_backend/

      - name: Run ruff
        run: ruff check oneplanet_backend/

  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      TESTING: "1"
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: "sqlite:///./test_ci.db"
      ONEPLANET_JWT_SECRET: "ci-test-secret-not-for-production"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest -v --maxfail=8 --cov=oneplanet_backend --cov-report=xml --cov-report=term-missing --junitxml=pytest-results.xml oneplanet_backend/tests/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
