name: CI

on:
  push:
    branches: [ main, master, dev-integration ]
  pull_request:
    branches: [ main, master, dev-integration ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oneplanet_backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API and integration tests
        run: |
          pytest -v --maxfail=8 --junitxml=pytest-results.xml tests/

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: oneplanet_backend/pytest-results.xml
