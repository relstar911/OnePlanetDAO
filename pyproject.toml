[project]
name = "oneplanet-backend"
version = "0.2.0"
description = "Backend API for OnePlanet DAO – a supranational governance platform for global citizens"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "OnePlanet DAO Contributors"},
]
keywords = ["dao", "governance", "quadratic-voting", "identity", "zero-knowledge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [
    "fastapi>=0.115.0,<1.0",
    "pydantic>=2.7.0,<3.0",
    "sqlalchemy>=2.0.30,<3.0",
    "sqlmodel>=0.0.19,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "python-jose[cryptography]>=3.3.0,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "slowapi>=0.1.9,<1.0",
    "httpx>=0.27.0,<1.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "python-dotenv>=1.0.0,<2.0",
    "alembic>=1.13.0,<2.0",
    "psycopg2-binary>=2.9.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-cov>=5.0.0,<6.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "black>=24.3.0,<25.0",
    "flake8>=7.0.0,<8.0",
    "ruff>=0.4.0,<1.0",
    "pre-commit>=3.7.0,<4.0",
    "mypy>=1.10.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/relstar911/OnePlanetDAO"
Documentation = "https://github.com/relstar911/OnePlanetDAO/tree/main/docs"
Repository = "https://github.com/relstar911/OnePlanetDAO"
Issues = "https://github.com/relstar911/OnePlanetDAO/issues"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oneplanet_backend*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["oneplanet_backend/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
