version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://oneplanet:oneplanet@db:5432/oneplanet
      - ONEPLANET_JWT_SECRET=${ONEPLANET_JWT_SECRET:-change-me-in-production}
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=oneplanet
      - POSTGRES_PASSWORD=oneplanet
      - POSTGRES_DB=oneplanet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneplanet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
